<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ไก่แหกปาก - สั่งอาหาร</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;600&display=swap');

  :root{
    --char: #1a1512;
    --char2: #241c17;
    --crust: #d4820a;
    --crust-bright: #f2a71c;
    --chili: #c1121f;
    --chili-bright: #e8432f;
    --cream: #f5e9d3;
    --cream-dim: #b8a98c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--char);
    color:var(--cream);
    font-family:'Sarabun', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{ font-family:'Kanit', sans-serif; }

  .app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:96px; }

  /* HEADER */
  header{
    background: linear-gradient(180deg, #2a1f16 0%, var(--char) 100%);
    padding: 28px 20px 22px;
    border-bottom: 3px solid var(--crust);
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px;
    background: radial-gradient(circle, rgba(212,130,10,0.35), transparent 70%);
  }
  .brand-eyebrow{
    font-size:12px; letter-spacing:2px; color:var(--crust-bright);
    text-transform:uppercase; font-weight:600;
  }
  .brand-name{
    font-size:32px; font-weight:800; color:var(--cream);
    margin-top:4px; line-height:1.1;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .brand-name span{ color:var(--chili-bright); }
  .brand-sub{ font-size:13px; color:var(--cream-dim); margin-top:6px; }

  /* MENU */
  .menu-section{ padding: 18px 16px 0; }
  .section-title{
    font-size:15px; font-weight:600; color:var(--crust-bright);
    letter-spacing:1px; text-transform:uppercase;
    margin: 18px 4px 10px;
  }
  .item-card{
    display:flex; align-items:center; gap:14px;
    background:var(--char2);
    border:1px solid rgba(212,130,10,0.18);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .item-emoji{
    font-size:30px; width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(212,130,10,0.12);
    border-radius:12px; flex-shrink:0;
  }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:16px; font-weight:600; color:var(--cream); }
  .item-price{ font-size:14px; color:var(--crust-bright); margin-top:2px; font-weight:600; }
  .item-desc{ font-size:12px; color:var(--cream-dim); margin-top:2px; }

  .stepper{
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .step-btn{
    width:30px; height:30px; border-radius:8px;
    border:none; background:rgba(245,233,211,0.08);
    color:var(--cream); font-size:18px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .step-btn.plus{ background:var(--chili); color:#fff; }
  .step-btn:active{ transform:scale(0.92); }
  .qty-val{ min-width:18px; text-align:center; font-weight:600; font-size:15px; }

  /* STICKY CART BAR */
  .cart-bar{
    position:fixed; bottom:0; left:0; right:0;
    max-width:480px; margin:0 auto;
    background: linear-gradient(180deg, var(--chili-bright), var(--chili));
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
    transform: translateY(120%);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.3);
    cursor:pointer;
  }
  .cart-bar.show{ transform:translateY(0); }
  .cart-bar .left{ display:flex; flex-direction:column; }
  .cart-count{ font-size:12px; opacity:0.9; }
  .cart-total{ font-size:19px; font-weight:800; font-family:'Kanit',sans-serif; }
  .cart-cta{
    background:#fff; color:var(--chili);
    font-weight:700; font-size:14px;
    padding:10px 20px; border-radius:999px;
    font-family:'Kanit',sans-serif;
  }

  /* MODAL / CHECKOUT */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none;
    transition:opacity 0.25s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px;
    background:var(--char2);
    border-radius:22px 22px 0 0;
    padding:22px 20px 28px;
    transform: translateY(30px);
    transition: transform 0.3s;
    max-height:85vh; overflow-y:auto;
  }
  .overlay.show .sheet{ transform: translateY(0); }
  .sheet-title{ font-size:20px; font-weight:700; margin-bottom:4px; }
  .sheet-close{
    position:absolute; top:16px; right:20px;
    background:none; border:none; color:var(--cream-dim);
    font-size:22px; cursor:pointer;
  }
  .cart-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid rgba(245,233,211,0.08);
    font-size:14px;
  }
  .cart-row .name{ color:var(--cream); }
  .cart-row .sub{ color:var(--cream-dim); font-size:12px; }
  .cart-row .amt{ font-weight:600; color:var(--crust-bright); }
  .empty-note{ color:var(--cream-dim); text-align:center; padding:30px 0; font-size:14px; }

  .total-line{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 0 4px; margin-top:6px;
    border-top:2px solid rgba(212,130,10,0.3);
  }
  .total-label{ font-size:15px; color:var(--cream-dim); }
  .total-amt{ font-size:26px; font-weight:800; font-family:'Kanit',sans-serif; color:var(--crust-bright); }

  .pay-btn{
    width:100%; margin-top:16px;
    background: linear-gradient(180deg, var(--chili-bright), var(--chili));
    color:#fff; border:none; border-radius:14px;
    padding:15px; font-size:16px; font-weight:700;
    font-family:'Kanit',sans-serif;
    cursor:pointer;
  }
  .pay-btn:disabled{ opacity:0.4; }

  /* QR SCREEN */
  .qr-wrap{ text-align:center; padding:6px 0 4px; }
  .qr-box{
    background:#fff; display:inline-block;
    padding:16px; border-radius:16px; margin:14px 0;
  }
  .qr-amount{ font-size:30px; font-weight:800; font-family:'Kanit',sans-serif; color:var(--crust-bright); }
  .qr-note{ font-size:13px; color:var(--cream-dim); margin-top:4px; }
  .qr-order-id{ font-size:12px; color:var(--cream-dim); margin-top:10px; }
  .done-btn{
    width:100%; margin-top:18px;
    background:rgba(245,233,211,0.08); color:var(--cream);
    border:none; border-radius:14px; padding:14px;
    font-family:'Kanit',sans-serif; font-weight:600; font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand-eyebrow">True5G x LINE Order</div>
    <div class="brand-name">ไก่แหก<span>ปาก</span></div>
    <div class="brand-sub">สั่งเลย จ่ายง่าย สแกน QR รับของหน้าร้าน</div>
  </header>

  <div class="menu-section" id="menuSection"></div>

</div>

<div class="cart-bar" id="cartBar">
  <div class="left">
    <div class="cart-count" id="cartCount">0 รายการ</div>
    <div class="cart-total" id="cartTotalPreview">฿0</div>
  </div>
  <div class="cart-cta">ดูตะกร้า</div>
</div>

<!-- CART SHEET -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeCart()">✕</button>
    <div class="sheet-title">ตะกร้าของคุณ</div>
    <div id="cartList"></div>
    <div class="total-line">
      <div class="total-label">ยอดรวม</div>
      <div class="total-amt" id="sheetTotal">฿0</div>
    </div>
    <button class="pay-btn" id="payBtn" onclick="goToPayment()">ชำระเงิน</button>
  </div>
</div>

<!-- QR SHEET -->
<div class="overlay" id="qrOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeQr()">✕</button>
    <div class="sheet-title">สแกนจ่ายด้วย PromptPay</div>
    <div class="qr-wrap">
      <div class="qr-amount" id="qrAmount">฿0</div>
      <div class="qr-box" id="qrCanvas"></div>
      <div class="qr-note">สแกนจากแอปธนาคารใดก็ได้ • ระบบไม่เก็บข้อมูลบัตร</div>
      <div class="qr-order-id" id="qrOrderId"></div>
    </div>
    <button class="done-btn" onclick="closeQr()">เสร็จสิ้น / กลับไปสั่งต่อ</button>
  </div>
</div>

<script>
/* ============================================================
   1) ตั้งค่าร้าน — แก้ตรงนี้ให้ตรงกับร้านจริง
   ============================================================ */
const PROMPTPAY_ID = "0812345678"; // TODO: ใส่เบอร์พร้อมเพย์หรือเลขผู้เสียภาษีร้านจริง

/* ============================================================
   2) เมนูอาหาร — แก้ชื่อ/ราคา/อีโมจิ หรือเพิ่มลบรายการได้เลย
   ============================================================ */
const MENU = [
  { id: "chk_original", name: "ไก่ทอดสูตรต้นตำรับ (4 ชิ้น)", price: 89, emoji: "🍗", desc: "กรอบนอกนุ่มใน" },
  { id: "chk_spicy",    name: "ไก่ทอดสูตรแซ่บ (4 ชิ้น)",      price: 95, emoji: "🌶️", desc: "เผ็ดจัดจ้าน" },
  { id: "rice_sticky",  name: "ข้าวเหนียว",                    price: 15, emoji: "🍚", desc: "" },
  { id: "somtum",       name: "ส้มตำไทย",                      price: 45, emoji: "🥗", desc: "" },
  { id: "coke",         name: "โค้ก",                           price: 20, emoji: "🥤", desc: "เย็นๆ ชื่นใจ" },
  { id: "combo1",       name: "เซ็ตไก่ + ข้าวเหนียว + โค้ก",   price: 109, emoji: "🍱", desc: "คุ้มสุด" },
];

/* ============================================================
   ด้านล่างนี้คือระบบตะกร้า + สร้าง QR — ไม่ต้องแก้ถ้าไม่จำเป็น
   ============================================================ */
const cart = {}; // id -> qty

function renderMenu(){
  const el = document.getElementById('menuSection');
  el.innerHTML = '<div class="section-title">เมนูวันนี้</div>' + MENU.map(item => `
    <div class="item-card">
      <div class="item-emoji">${item.emoji}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-price">฿${item.price}</div>
        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
      </div>
      <div class="stepper">
        <button class="step-btn minus" onclick="changeQty('${item.id}', -1)">−</button>
        <div class="qty-val" id="qty-${item.id}">0</div>
        <button class="step-btn plus" onclick="changeQty('${item.id}', 1)">+</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta){
  const current = cart[id] || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) delete cart[id]; else cart[id] = next;
  document.getElementById(`qty-${id}`).textContent = next;
  updateCartBar();
}

function cartItems(){
  return Object.entries(cart).map(([id, qty]) => {
    const item = MENU.find(m => m.id === id);
    return { ...item, qty, subtotal: item.price * qty };
  });
}

function cartTotal(){
  return cartItems().reduce((sum, i) => sum + i.subtotal, 0);
}

function updateCartBar(){
  const items = cartItems();
  const count = items.reduce((s,i)=>s+i.qty,0);
  const total = cartTotal();
  document.getElementById('cartCount').textContent = `${count} รายการ`;
  document.getElementById('cartTotalPreview').textContent = `฿${total}`;
  document.getElementById('cartBar').classList.toggle('show', count > 0);
}

document.getElementById('cartBar').addEventListener('click', openCart);

function openCart(){
  const items = cartItems();
  const listEl = document.getElementById('cartList');
  if (items.length === 0){
    listEl.innerHTML = '<div class="empty-note">ยังไม่มีรายการในตะกร้า</div>';
  } else {
    listEl.innerHTML = items.map(i => `
      <div class="cart-row">
        <div>
          <div class="name">${i.name}</div>
          <div class="sub">฿${i.price} x ${i.qty}</div>
        </div>
        <div class="amt">฿${i.subtotal}</div>
      </div>
    `).join('');
  }
  document.getElementById('sheetTotal').textContent = `฿${cartTotal()}`;
  document.getElementById('payBtn').disabled = items.length === 0;
  document.getElementById('cartOverlay').classList.add('show');
}
function closeCart(){ document.getElementById('cartOverlay').classList.remove('show'); }

function goToPayment(){
  const total = cartTotal();
  if (total <= 0) return;
  closeCart();
  showQr(total);
}

/* ---------- PromptPay QR payload (มาตรฐาน EMV QR ของไทย) ---------- */
function crc16ccitt(str){
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++){
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function tlv(id, value){
  return id + String(value.length).padStart(2, '0') + value;
}
function buildPromptPayPayload(target, amount){
  let id = target.replace(/[^0-9]/g, '');
  let subTag, subValue;
  if (id.length >= 15){
    subTag = '02'; subValue = id.padStart(13, '0'); // เลขผู้เสียภาษี/นิติบุคคล
  } else if (id.length >= 13){
    subTag = '03'; subValue = id.padStart(15, '0'); // e-Wallet ID
  } else {
    if (id.startsWith('0')) id = '66' + id.substring(1);
    subTag = '01'; subValue = id.padStart(13, '0'); // เบอร์มือถือ
  }
  const merchantInfo = tlv('00', 'A000000677010111') + tlv(subTag, subValue);
  let payload =
    tlv('00', '01') +
    tlv('01', '12') + // dynamic QR (มีจำนวนเงินระบุ)
    tlv('29', merchantInfo) +
    tlv('53', '764') +
    tlv('54', amount.toFixed(2)) +
    tlv('58', 'TH');
  payload += '6304';
  return payload + crc16ccitt(payload);
}

let qrRendered = null;
function showQr(amount){
  const payload = buildPromptPayPayload(PROMPTPAY_ID, amount);
  document.getElementById('qrAmount').textContent = `฿${amount}`;
  const orderId = 'ORD-' + Date.now().toString().slice(-6);
  document.getElementById('qrOrderId').textContent = `เลขที่ออเดอร์: ${orderId}`;
  const box = document.getElementById('qrCanvas');
  box.innerHTML = '';
  new QRCode(box, { text: payload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('qrOverlay').classList.add('show');
}
function closeQr(){
  document.getElementById('qrOverlay').classList.remove('show');
  // เคลียร์ตะกร้าหลังจ่ายเสร็จ
  Object.keys(cart).forEach(id => { delete cart[id]; document.getElementById(`qty-${id}`).textContent = '0'; });
  updateCartBar();
}

renderMenu();
</script>
</body>
</html>
